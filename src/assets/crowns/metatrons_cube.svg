<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" stroke="#5ffce0" stroke-width="0.75" opacity="0.35">
  <!-- Metatron's Cube: 13 nodes with interconnected lines -->
  <!-- Center node -->
  <circle cx="400" cy="400" r="8"/>
  <!-- Inner ring: 6 nodes -->
  <circle cx="500" cy="400" r="8"/>
  <circle cx="450" cy="486.6" r="8"/>
  <circle cx="350" cy="486.6" r="8"/>
  <circle cx="300" cy="400" r="8"/>
  <circle cx="350" cy="313.4" r="8"/>
  <circle cx="450" cy="313.4" r="8"/>
  <!-- Outer ring: 6 nodes -->
  <circle cx="600" cy="400" r="8"/>
  <circle cx="500" cy="573.2" r="8"/>
  <circle cx="300" cy="573.2" r="8"/>
  <circle cx="200" cy="400" r="8"/>
  <circle cx="300" cy="226.8" r="8"/>
  <circle cx="500" cy="226.8" r="8"/>
  <!-- All interconnections: center to inner -->
  <line x1="400" y1="400" x2="500" y2="400"/>
  <line x1="400" y1="400" x2="450" y2="486.6"/>
  <line x1="400" y1="400" x2="350" y2="486.6"/>
  <line x1="400" y1="400" x2="300" y2="400"/>
  <line x1="400" y1="400" x2="350" y2="313.4"/>
  <line x1="400" y1="400" x2="450" y2="313.4"/>
  <!-- Center to outer -->
  <line x1="400" y1="400" x2="600" y2="400"/>
  <line x1="400" y1="400" x2="500" y2="573.2"/>
  <line x1="400" y1="400" x2="300" y2="573.2"/>
  <line x1="400" y1="400" x2="200" y2="400"/>
  <line x1="400" y1="400" x2="300" y2="226.8"/>
  <line x1="400" y1="400" x2="500" y2="226.8"/>
  <!-- Inner ring interconnections -->
  <line x1="500" y1="400" x2="450" y2="486.6"/>
  <line x1="450" y1="486.6" x2="350" y2="486.6"/>
  <line x1="350" y1="486.6" x2="300" y2="400"/>
  <line x1="300" y1="400" x2="350" y2="313.4"/>
  <line x1="350" y1="313.4" x2="450" y2="313.4"/>
  <line x1="450" y1="313.4" x2="500" y2="400"/>
  <!-- Inner to outer connections -->
  <line x1="500" y1="400" x2="600" y2="400"/>
  <line x1="500" y1="400" x2="500" y2="573.2"/>
  <line x1="450" y1="486.6" x2="500" y2="573.2"/>
  <line x1="450" y1="486.6" x2="300" y2="573.2"/>
  <line x1="350" y1="486.6" x2="300" y2="573.2"/>
  <line x1="350" y1="486.6" x2="200" y2="400"/>
  <line x1="300" y1="400" x2="200" y2="400"/>
  <line x1="300" y1="400" x2="300" y2="226.8"/>
  <line x1="350" y1="313.4" x2="300" y2="226.8"/>
  <line x1="350" y1="313.4" x2="500" y2="226.8"/>
  <line x1="450" y1="313.4" x2="500" y2="226.8"/>
  <line x1="450" y1="313.4" x2="600" y2="400"/>
  <!-- Outer cross-connections -->
  <line x1="600" y1="400" x2="500" y2="573.2"/>
  <line x1="500" y1="573.2" x2="300" y2="573.2"/>
  <line x1="300" y1="573.2" x2="200" y2="400"/>
  <line x1="200" y1="400" x2="300" y2="226.8"/>
  <line x1="300" y1="226.8" x2="500" y2="226.8"/>
  <line x1="500" y1="226.8" x2="600" y2="400"/>
  <!-- Opposite outer connections -->
  <line x1="600" y1="400" x2="200" y2="400"/>
  <line x1="500" y1="573.2" x2="300" y2="226.8"/>
  <line x1="300" y1="573.2" x2="500" y2="226.8"/>
</svg>
