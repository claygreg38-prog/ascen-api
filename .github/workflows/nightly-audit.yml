name: Nightly ASCEN Audit
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          ERRORS=0
          for f in $(find src/ -name "*.js"); do
            node -c "$f" 2>/dev/null || { echo "FAIL: $f"; ERRORS=$((ERRORS+1)); }
          done
          echo "Syntax errors found: $ERRORS"
          [ $ERRORS -eq 0 ] || exit 1

      - name: Check for blockchain terms in frontend
        run: |
          if [ -d "frontend/src" ]; then
            HITS=$(grep -ril "NFT\|blockchain\|minting\|soulbound\|mint token\|crypto wallet" frontend/src/ --include="*.jsx" --include="*.js" | grep -v node_modules || true)
            if [ -n "$HITS" ]; then
              echo "FAIL: Blockchain terms found:"
              echo "$HITS"
              exit 1
            fi
          fi
          echo "PASS: No blockchain terms in frontend"

      - name: Check for clinical terms in frontend
        run: |
          if [ -d "frontend/src" ]; then
            HITS=$(grep -ril "NS3\|HRV score\|coherence score\|diagnosis" frontend/src/ --include="*.jsx" --include="*.js" | grep -v node_modules || true)
            if [ -n "$HITS" ]; then
              echo "FAIL: Clinical terms found:"
              echo "$HITS"
              exit 1
            fi
          fi
          echo "PASS: No clinical terms in frontend"
