name: ASCEN CI
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JS files
        run: |
          find src/ -name "*.js" -exec node -c {} \;
          echo "All JS files pass syntax check"

      - name: Wait for Railway deploy
        run: sleep 90

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_FACILITATOR_EMAIL: ${{ secrets.TEST_FACILITATOR_EMAIL }}
          TEST_FACILITATOR_PASSWORD: ${{ secrets.TEST_FACILITATOR_PASSWORD }}
          TEST_PARTICIPANT_1_ID: ${{ secrets.TEST_PARTICIPANT_1_ID }}
          TEST_PARTICIPANT_1_PIN: ${{ secrets.TEST_PARTICIPANT_1_PIN }}
          TEST_PARTICIPANT_2_ID: ${{ secrets.TEST_PARTICIPANT_2_ID }}
          TEST_PARTICIPANT_2_PIN: ${{ secrets.TEST_PARTICIPANT_2_PIN }}
          TEST_FAMILY_UNIT_ID: ${{ secrets.TEST_FAMILY_UNIT_ID }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
